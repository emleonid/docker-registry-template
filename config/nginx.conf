user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format registry_log '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log registry_log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 2000M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # DDoS Protection - Connection limits
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    
    # Rate limiting for API endpoints (increased for docker push operations)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    
    # Limit for authentication attempts (removed from /v2/ location, kept for other endpoints)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    # GeoIP blocking (configure as needed)
    # geo $blocked_country {
    #     default 0;
    #     CN 1;  # Block China
    #     RU 1;  # Block Pidorussia
    # }

    # Map for blocking bad user agents (improved)
    map $http_user_agent $bad_bot {
        default 0;
        ~*^$ 1;  # Empty user agents
        ~*(bot|crawler|spider) 0;  # Allow legitimate bots
        ~*(masscan|nmap|nikto|sqlmap|acunetix|metasploit) 1;  # Block security scanners
        ~*(360spider|semrush|mj12bot|ahrefsbot) 1;  # Block aggressive crawlers
    }
    
    # Map to block common exploit attempts
    map $request_uri $exploit_attempt {
        default 0;
        "~*\.\./\.\." 1;                  # Path traversal
        "~*/\.\." 1;
        "~*\.(sh|bash|cgi|pl|py|exe|dll)$" 1;  # Executable files
        "~*[<>'\x22;()]" 1;                      # Potential XSS/injection
        "~*(union.*select|concat.*\(|script.*\>)" 1;  # SQL injection attempts
    }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
