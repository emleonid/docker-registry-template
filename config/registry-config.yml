version: 0.1
log:
  level: info
  formatter: text
  fields:
    service: registry
    environment: production

storage:
  s3:
    accesskey: ${R2_ACCESS_KEY_ID}
    secretkey: ${R2_SECRET_ACCESS_KEY}
    region: auto
    regionendpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    encrypt: true
    secure: true
    v4auth: true
    chunksize: 5242880
    rootdirectory: prod-data
    forcepathstyle: true
    multipartcopychunksize: 33554432
    multipartcopymaxconcurrency: 100
    multipartcopythresholdsize: 33554432
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
  redirect:
    disable: true
  maintenance:
    uploadpurging:
      enabled: true
      age: 24h
      interval: 24h
      dryrun: false
    readonly:
      enabled: false

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
    X-Frame-Options: [DENY]
    X-XSS-Protection: ["1; mode=block"]
    Strict-Transport-Security: ["max-age=31536000; includeSubDomains"]
  debug:
    addr: :5001
    prometheus:
      enabled: true
      path: /metrics

auth:
  htpasswd:
    realm: Docker Registry
    path: /auth/htpasswd

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3

# Catalog configuration for listing repositories
catalog:
  maxentries: 5000

# Validation for manifest uploads
validation:
  manifests:
    urls:
      allow:
        - ^https?://
