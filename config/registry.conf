# Docker Registry Nginx Configuration
# This file should be copied to /etc/nginx/conf.d/registry.conf or /etc/nginx/sites-available/registry

# Upstream configuration - Docker Registry backend
upstream docker-registry {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name your-registry-domain.com;  # CHANGE THIS to your domain
    
    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server for Docker Registry
server {
    listen 443 ssl default_server;
    server_name your-registry-domain.com;  # CHANGE THIS to your domain

    # SSL Configuration - Let's Encrypt certificates
    # IMPORTANT: Update these paths to match your domain and certificate location
    ssl_certificate /etc/letsencrypt/live/your-registry-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-registry-domain.com/privkey.pem;
    
    # Strong SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Block bad bots
    if ($bad_bot) {
        return 403;
    }
    
    # Block exploit attempts
    if ($exploit_attempt) {
        return 403;
    }

    # Block based on GeoIP (if configured)
    # if ($blocked_country) {
    #     return 403;
    # }
    
    # Additional security: Block suspicious request methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$ ) {
        return 405;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Docker Registry API v2
    location /v2/ {
        # Do not allow connections from docker 1.5 and earlier
        if ($http_user_agent ~ "^(docker\/1\.(3|4|5(?!\.[0-9]-dev))|Go ).*$" ) {
            return 404;
        }

        # Required for Docker Registry
        proxy_pass http://docker-registry;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        client_max_body_size 0;

        # Disable buffering for large uploads (REQUIRED for docker push)
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        
        # Enable chunked transfer encoding (REQUIRED for docker registry)
        chunked_transfer_encoding on;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Security headers for proxied requests
        add_header Docker-Distribution-Api-Version registry/2.0 always;
    }

    # Health check endpoint (no authentication required)
    location /v2/_ping {
        access_log off;
        proxy_pass http://docker-registry;
        proxy_set_header Host $http_host;
    }

    # Deny access to all other locations
    location / {
        return 404;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
