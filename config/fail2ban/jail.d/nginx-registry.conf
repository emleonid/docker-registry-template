[DEFAULT]
# Ban hosts for 1 hour (3600 seconds)
bantime = 3600

# Find time window (10 minutes)
findtime = 600

# Number of failures before ban
maxretry = 5

# Email notifications (configure if needed)
# destemail = admin@yourdomain.com
# sendername = Fail2Ban
# action = %(action_mwl)s

[nginx-http-auth]
enabled = true
port = http,https
filter = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 5
findtime = 600
bantime = 3600

[nginx-noscript]
enabled = true
port = http,https
filter = nginx-noscript
logpath = /var/log/nginx/access.log
maxretry = 6
findtime = 600
bantime = 3600

[nginx-badbots]
enabled = true
port = http,https
filter = nginx-badbots
logpath = /var/log/nginx/access.log
maxretry = 2
findtime = 600
bantime = 86400

[nginx-noproxy]
enabled = true
port = http,https
filter = nginx-noproxy
logpath = /var/log/nginx/access.log
maxretry = 2
findtime = 600
bantime = 86400

[nginx-limit-req]
enabled = true
port = http,https
filter = nginx-limit-req
logpath = /var/log/nginx/error.log
maxretry = 10
findtime = 600
bantime = 3600

[docker-registry-auth]
enabled = true
port = http,https
filter = docker-registry-auth
logpath = /var/log/nginx/access.log
# Increased for CI/CD systems like GitHub Actions which make many rapid requests
maxretry = 20
findtime = 900
bantime = 3600

# Note: GitHub Actions uses dynamic IPs, so IP whitelisting is not practical
# The higher maxretry value accommodates automated CI/CD workflows
