services:
  # Main Docker Registry with R2 storage
  registry:
    image: registry:2
    container_name: docker-registry
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Authentication
      REGISTRY_AUTH: "htpasswd"
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: "/auth/htpasswd"
      REGISTRY_HTTP_SECRET: "${REGISTRY_HTTP_SECRET}"

      # Cloudflare R2 Storage (S3-compatible)
      REGISTRY_STORAGE: "s3"
      REGISTRY_STORAGE_S3_ACCESSKEY: "${R2_ACCESS_KEY_ID}"
      REGISTRY_STORAGE_S3_SECRETKEY: "${R2_SECRET_ACCESS_KEY}"
      REGISTRY_STORAGE_S3_REGION: "auto"
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "${R2_ENDPOINT}"
      REGISTRY_STORAGE_S3_BUCKET: "${R2_BUCKET}"

      # Cloudflare R2 Storage Configuration
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: "/prod-data"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_REDIRECT_DISABLE: "true"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_S3_V4AUTH: "true"
      REGISTRY_STORAGE_S3_CHUNKSIZE: "10485760"

      # Cloudflare R2 Storage Multipart Copy Settings
      REGISTRY_STORAGE_S3_MULTIPARTCOPYCHUNKSIZE: "33554432"
      REGISTRY_STORAGE_S3_MULTIPARTCOPYMAXCONCURRENCY: "100"
      REGISTRY_STORAGE_S3_MULTIPARTCOPYTHRESHOLDSIZE: "33554432"

      # --- Cloudflare R2 Maintenance ---
      REGISTRY_MAINTENANCE_UPLOADPURGING_ENABLED: "true"
      REGISTRY_MAINTENANCE_UPLOADPURGING_AGE: "24h"
      REGISTRY_MAINTENANCE_UPLOADPURGING_INTERVAL: "24h"
      REGISTRY_MAINTENANCE_UPLOADPURGING_DRYRUN: "false"

      # HTTP configuration
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      REGISTRY_HTTP_HOST: "https://${REGISTRY_DOMAIN}"

      # This allows us to check health without a password
      REGISTRY_HTTP_DEBUG_ADDR: "0.0.0.0:5001"
      REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED: "true"
      REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH: "/metrics"

      # Health check configuration (Internal)
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_INTERVAL: "10s"
      REGISTRY_HEALTH_STORAGEDRIVER_THRESHOLD: "3"
    volumes:
      - ./auth:/auth:ro
    networks:
      - registry-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Fail2ban for additional security (optional but recommended)
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: registry-fail2ban
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /var/log/nginx:/var/log/nginx:ro
      - ./config/fail2ban:/data
      - ./storage/fail2ban-data:/data/db
    environment:
      - TZ=${TIMEZONE:-UTC}
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d

networks:
  registry-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  fail2ban-data:
